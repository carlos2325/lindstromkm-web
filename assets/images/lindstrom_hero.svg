<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustración de perforación de gas submarino de LINDSTROM KM">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2036"/>
      <stop offset="0.45" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#0B1320"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc7e6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9fc7e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="drill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C87A3E"/>
      <stop offset="1" stop-color="#E0A96D"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#sea)"/>

  <!-- rayos de luz -->
  <g>
    <polygon points="180,-20 320,-20 250,560 210,560" fill="url(#ray)"/>
    <polygon points="440,-20 560,-20 520,600 470,600" fill="url(#ray)"/>
    <polygon points="640,-20 720,-20 690,520 660,520" fill="url(#ray)" opacity="0.7"/>
  </g>

  <!-- estratos oceánicos / lecho marino -->
  <g fill="none" stroke-linecap="round">
    <path d="M-20,560 Q 240,520 420,560 T 840,560" stroke="#E0A96D" stroke-width="7" opacity="0.85"/>
    <path d="M-20,630 Q 240,590 420,630 T 840,630" stroke="#64748B" stroke-width="7" opacity="0.75"/>
    <path d="M-20,710 Q 260,668 440,712 T 840,706" stroke="#C87A3E" stroke-width="8" opacity="0.9"/>
    <path d="M-20,800 Q 260,760 440,804 T 840,800" stroke="#1E3A5F" stroke-width="10" opacity="0.9"/>
    <path d="M-20,890 Q 260,852 440,894 T 840,890" stroke="#243b57" stroke-width="14" opacity="0.85"/>
  </g>

  <!-- broca de perforación descendente (eco del Isotipo 19) -->
  <g>
    <rect x="486" y="120" width="28" height="470" rx="4" fill="#CBD5E1"/>
    <path d="M486,588 L514,588 L500,632 Z" fill="#CBD5E1"/>
    <line x1="486" y1="300" x2="514" y2="312" stroke="#0B1320" stroke-width="6"/>
    <line x1="486" y1="380" x2="514" y2="392" stroke="#0B1320" stroke-width="6"/>
    <line x1="486" y1="460" x2="514" y2="472" stroke="#0B1320" stroke-width="6"/>
    <!-- punta de cobre entrando en el estrato -->
    <path d="M470,120 H530 V150 L500,205 L470,150 Z" fill="url(#drill)"/>
  </g>

  <!-- burbujas -->
  <g fill="#9fc7e6" opacity="0.5">
    <circle cx="540" cy="400" r="4"/><circle cx="560" cy="340" r="3"/><circle cx="528" cy="270" r="2.5"/>
    <circle cx="558" cy="470" r="3"/><circle cx="575" cy="230" r="2"/>
  </g>

  <!-- viñeta inferior -->
  <linearGradient id="vigL" x1="0" y1="1" x2="0.35" y2="0.45">
    <stop offset="0" stop-color="#060d18" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#060d18" stop-opacity="0"/>
  </linearGradient>
  <rect width="800" height="1000" fill="url(#vigL)"/>
</svg>
